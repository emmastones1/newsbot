name: Forex News Bot

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes, UTC (GitHub doesn't guarantee exact timing)
  workflow_dispatch:
    inputs:
      force_send:
        description: 'Send everything immediately, ignoring schedule (for testing)'
        type: boolean
        default: false

permissions:
  contents: write   # needed so the workflow can commit updated user data back to the repo

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot check
        run: python3 forex_news_bot.py
        env:
          FF_BOT_TOKEN: ${{ secrets.FF_BOT_TOKEN }}
          FF_CHAT_ID: ${{ secrets.FF_CHAT_ID }}
          FF_LOCAL_TZ: Africa/Lagos
          FF_DIGEST_TIME: '06:00'
          FF_ALERT_MINUTES: '30'
          FF_FORCE_SEND: ${{ inputs.force_send }}
          FF_DATA_KEY: ${{ secrets.FF_DATA_KEY }}

      - name: Persist any user data changes
        run: |
          if [ -n "$(git status --porcelain data/ 2>/dev/null)" ]; then
            git config user.name "fx-pulse-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/
            git commit -m "Update stored user data [skip ci]"
            git push
          else
            echo "No data changes to commit."
          fi
